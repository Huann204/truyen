<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c24"/>
      <stop offset="50%" stop-color="#121217"/>
      <stop offset="100%" stop-color="#09090c"/>
    </linearGradient>

    <!-- Vibrant Brand Gradient (Coral Red -> Vibrant Orange -> Warm Gold) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="45%" stop-color="#FF5A36"/>
      <stop offset="100%" stop-color="#FFA114"/>
    </linearGradient>

    <!-- Secondary Accent Gradient for Page Folds -->
    <linearGradient id="secondaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>

    <!-- Top Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFA826"/>
      <stop offset="100%" stop-color="#FF4336"/>
    </linearGradient>

    <!-- Soft Glow Ambient Filter -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A36" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF5A36" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base with 112px border radius -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3"/>
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="rgba(255, 75, 54, 0.25)" stroke-width="1.5"/>

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="256" cy="256" r="170" fill="url(#centerGlow)"/>

  <!-- Logo Mark Graphic (Stylized K + Open Book Chapters) -->
  <g transform="translate(256, 256) scale(1)">
    <!-- Left Spine / Vertical Book Page -->
    <path d="M -130,-115
             C -130,-130 -115,-140 -98,-135
             L -42,-120
             C -30,-116 -20,-106 -20,-92
             L -20,105
             C -20,122 -35,134 -52,130
             L -108,114
             C -122,110 -130,98 -130,84
             Z"
          fill="url(#secondaryGrad)"/>

    <!-- Left Page Inner Shimmer Curve -->
    <path d="M -118,-95
             C -118,-106 -108,-113 -96,-110
             L -46,-97
             C -38,-95 -32,-88 -32,-79
             L -32,80
             C -32,91 -42,98 -54,95
             L -104,82
             C -113,80 -118,72 -118,63
             Z"
          fill="rgba(255,255,255,0.18)"/>

    <!-- Right Top Wing (Upper arm of 'K' / fanning upper chapter page) -->
    <path d="M -10,-15
             C -10,-28 0,-38 12,-42
             L 105,-82
             C 124,-90 144,-74 140,-53
             L 125,-10
             C 121,-1 113,6 103,9
             L 22,34
             C 4,40 -10,26 -10,9
             Z"
          fill="url(#wingGrad)"/>

    <!-- Right Top Wing Page Highlight -->
    <path d="M 12,-20
             L 95,-55
             C 107,-60 119,-50 117,-37
             L 107,-7
             L 22,20
             Z"
          fill="rgba(255,255,255,0.22)"/>

    <!-- Right Bottom Wing (Lower arm of 'K' / bottom book page & swoosh) -->
    <path d="M -5,45
             C 8,38 24,42 34,51
             L 115,112
             C 129,122 124,144 107,148
             L 60,155
             C 48,157 37,151 30,142
             L -20,78
             C -30,64 -18,48 -5,45
             Z"
          fill="url(#primaryGrad)"/>

    <!-- Center Core / Golden Bookmark Gem & Ribbon Spine -->
    <path d="M -26,-135
             C -26,-140 -20,-144 -15,-142
             L 0,-136
             C 6,-134 10,-128 10,-122
             L 10,132
             C 10,140 2,146 -6,144
             L -20,140
             C -24,138 -26,134 -26,130
             Z"
          fill="url(#primaryGrad)"
          opacity="0.95"/>

    <!-- Sparkle / Magic Star (Top Right Corner of Emblem) -->
    <g transform="translate(122, -108) scale(0.95)">
      <path d="M 0,-28
               C 2,-10 10,-2 28,0
               C 10,2 2,10 0,28
               C -2,10 -10,2 -28,0
               C -10,-2 -2,-10 0,-28 Z"
            fill="#FFE67B"/>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Small Secondary Accent Sparkle -->
    <g transform="translate(155, -55) scale(0.45)">
      <path d="M 0,-24
               C 2,-8 8,-2 24,0
               C 8,2 2,8 0,24
               C -2,8 -8,2 -24,0
               C -8,-2 -2,-8 0,-24 Z"
            fill="#FFAA40"/>
    </g>
  </g>
</svg>